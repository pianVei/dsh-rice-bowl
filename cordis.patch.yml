# dsh-rice-bowl
# 装上之后，DSH 里的模型多十三个工具：list / read / write / like / save /
# forward / who / rooms / report / remember / recall / detect / score。
# 没配 token 时自动进只读模式：list / read / forward 能用，写操作明确报「这个要 GitHub 账号」。
# 想改仓库（比如自己 fork 了一个），设环境变量 RICE_BOWL_REPO=owner/repo。
- insert:
    - id: rice-bowl
      name: 'dsh-rice-bowl'
